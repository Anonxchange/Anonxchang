<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Nova Airdrop Terminal</title>
    <meta name="description" content="Premium airdrop claim terminal for serious crypto users." />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Patch window.open for Telegram WebApp compatibility.
      // Telegram's WebView blocks window.open(), breaking wallet deep links.
      // Fix window.open() inside Telegram's WebView (WKWebView on iOS blocks it).
      // Strategy:
      //   - Wallet universal links (link.trustwallet.com, metamask.app.link, etc.)
      //     → window.location.href so iOS intercepts the universal link and opens
      //       the wallet app directly (tg.openLink opens Telegram's in-app browser
      //       which cannot trigger universal links).
      //   - Custom wallet schemes (trust://, metamask://, wc:, etc.)
      //     → window.location.href to let the OS route to the wallet.
      //   - All other https links (e.g. WalletConnect relay pages)
      //     → tg.openLink() to open in an external browser.
      (function () {
        var _origOpen = window.open.bind(window);

        var WALLET_UNIVERSAL_DOMAINS = [
          'link.trustwallet.com',
          'metamask.app.link',
          'go.cb-w.com',          // Coinbase Wallet
          'wallet.coinbase.com',
          'app.zerion.io',
          'bnc.lt',               // Binance / BNB Chain
          'rainbow.me',
          '1inch.io',
          'exodus.com',
          'walletconnect.com',    // WalletConnect redirect pages
          'walletconnect.org',
        ];

        function isWalletUniversalLink(url) {
          for (var i = 0; i < WALLET_UNIVERSAL_DOMAINS.length; i++) {
            if (url.indexOf(WALLET_UNIVERSAL_DOMAINS[i]) !== -1) return true;
          }
          return false;
        }

        window.open = function (url, target, features) {
          if (!url) return _origOpen(url, target, features);
          var s = String(url);
          var tg = window.Telegram && window.Telegram.WebApp;
          if (tg) {
            // Wallet universal links — must use location.href for iOS universal link interception
            if (isWalletUniversalLink(s)) {
              window.location.href = s;
              return null;
            }
            // Custom wallet URI schemes
            if (/^(trust|metamask|wc|binance|exodus|rainbow|zerion|coinbase|1inch):/.test(s)) {
              window.location.href = s;
              return null;
            }
            // Any other external https link — open in external browser via Telegram
            if (s.startsWith('https://') || s.startsWith('http://')) {
              try { tg.openLink(s); } catch (e) { _origOpen(url, target, features); }
              return null;
            }
          }
          return _origOpen(url, target, features);
        };
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        var BADGE_TAGS = ['replit-pill', 'replit-badge'];
        var BADGE_PATTERNS = ['replit-cdn.com', 'replit.com/badge', 'replit.com/public/images/replit'];

        // Pre-register Replit custom elements as instant self-removing no-ops
        BADGE_TAGS.forEach(function (tag) {
          if (!customElements.get(tag)) {
            customElements.define(tag, class extends HTMLElement {
              connectedCallback() { this.style.cssText = 'display:none!important'; this.remove(); }
            });
          }
        });

        function isBadgeNode(node) {
          if (!node || node.nodeType !== 1) return false;
          var tag = (node.tagName || '').toLowerCase();
          var src = node.src || node.href || '';
          var cls = (node.className || '').toString();
          var id = (node.id || '');
          if (BADGE_TAGS.indexOf(tag) !== -1) return true;
          if (id.toLowerCase().indexOf('replit') !== -1) return true;
          if (cls.toLowerCase().indexOf('replit') !== -1) return true;
          if (node.getAttribute('data-repl-id') !== null) return true;
          if (node.getAttribute('data-referral-code') !== null) return true;
          if (node.getAttribute('data-replit-badge') !== null) return true;
          for (var i = 0; i < BADGE_PATTERNS.length; i++) {
            if (src.indexOf(BADGE_PATTERNS[i]) !== -1) return true;
          }
          return false;
        }

        function nukeBadges(root) {
          (root || document).querySelectorAll && (root || document).querySelectorAll(
            'replit-badge,replit-pill,[data-repl-id],[data-replit-badge],iframe[src*="replit-cdn.com"],iframe[src*="replit.com/badge"]'
          ).forEach(function(el) { el.remove(); });
        }

        // MutationObserver: kill any badge the instant it's added
        var observer = new MutationObserver(function (mutations) {
          mutations.forEach(function (mutation) {
            mutation.addedNodes.forEach(function (node) {
              if (isBadgeNode(node)) { node.remove(); return; }
              // Also scan children of added subtrees
              if (node.nodeType === 1) nukeBadges(node);
            });
          });
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });

        // Belt-and-suspenders: periodic sweep every 500ms for the first 10s
        var sweepCount = 0;
        var sweepInterval = setInterval(function () {
          nukeBadges();
          if (++sweepCount >= 20) clearInterval(sweepInterval);
        }, 500);
      })();
    </script>
    <style>
      replit-pill,
      replit-badge,
      #replit-badge,
      [id*="replit-badge"],
      [class*="replit-badge"],
      [data-referral-code],
      [data-repl-id],
      [data-replit-badge],
      iframe[src*="replit.com/badge"],
      iframe[src*="replit-cdn.com"],
      iframe[src*="replit.com/public"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        width: 0 !important;
        height: 0 !important;
        pointer-events: none !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
